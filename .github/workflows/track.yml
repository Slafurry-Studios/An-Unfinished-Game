name: Track Drive Changes

on:
  schedule:
    - cron: '0 23 * * *'  # 07:00 WITA (UTC+8) daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Sync latest state from main
        run: |
          git fetch origin main

          rm -rf state
          mkdir -p state

          git archive origin/main -- state 2>/dev/null | tar -x || true

      - name: Check sprite folder for changes
        run: |
          python track.py \
            --drive-folder-id "${{ secrets.DRIVE_SPRITE_FOLDER_ID }}" \
            --service-account-b64 "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" \
            --discord-webhook "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            --state-file "state/sprite_manifest.json" \
            --project-name "${{ github.repository }} (sprite)"

      - name: Check audio folder for changes
        run: |
          python track.py \
            --drive-folder-id "${{ secrets.DRIVE_AUDIO_FOLDER_ID }}" \
            --service-account-b64 "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" \
            --discord-webhook "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            --state-file "state/audio_manifest.json" \
            --project-name "${{ github.repository }} (audio)"

      - name: Commit updated state to chore/asset
        run: |
          git config user.name "Kozeki Ui"
          git config user.email "45u35+kozeki-ui[bot]@users.noreply.github.com"

          git fetch origin main

          WORKTREE=/tmp/chore-asset

          # chore/asset is disposable.
          # Always recreate it from the latest main.
          git branch -D chore/asset 2>/dev/null || true
          git push origin --delete chore/asset 2>/dev/null || true

          git worktree add -b chore/asset "$WORKTREE" origin/main

          mkdir -p "$WORKTREE/state"
          cp -f state/*.json "$WORKTREE/state/" 2>/dev/null || true

          cd "$WORKTREE"

          git add state/

          if git diff --cached --quiet; then
            echo "No state changes, skipping."
            exit 0
          fi

          git commit -m "chore(assets): update drive state [skip ci]"
          git push origin HEAD:chore/asset